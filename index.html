        onClick={() => onCheckedChange(!checked)}
        className={`relative h-4 w-7 shrink-0 rounded-lg ${checked ? "bg-[#7F64F7]" : "bg-[#333137]"}`}
      >
        <span className={`absolute left-0.5 top-0.5 size-3 rounded-full bg-white transition-transform
          ${checked ? "translate-x-3" : ""}`} />

enum ButtonSize {
  px24(24, 12, 6, 4, 12, 10, 4, 4),
  px32(32, 14, 8, 6, 12, 8, 8, 8),
  px36(36, 14, 8, 8, 14, 12, 8, 9),
  px40(40, 14, 8, 8, 16, 14, 8, 10),
  px48(48, 16, 8, 8, 20, 16, 10, 12);

  const ButtonSize(this.h, this.font, this.radius, this.gap, this.padText, this.padOne, this.padBoth, this.padOnly);
  final double h, font, radius, gap, padText, padOne, padBoth, padOnly;
}

class PukuButton extends StatelessWidget {
  const PukuButton({super.key, this.label, this.size = ButtonSize.px40, this.iconLeft,
      this.iconRight, this.iconOnly, this.onPressed});
  final String? label;
  final ButtonSize size;
  final Widget? iconLeft, iconRight, iconOnly;
  final VoidCallback? onPressed;

  @override
  Widget build(BuildContext context) {
    final only = iconOnly != null;
    final both = iconLeft != null && iconRight != null;
    final pad = only ? size.padOnly : both ? size.padBoth
        : (iconLeft != null || iconRight != null) ? size.padOne : size.padText;
    bool has(Set<WidgetState> s, WidgetState x) => s.contains(x);
    return TextButton(
      onPressed: onPressed,
      style: ButtonStyle(
        minimumSize: WidgetStatePropertyAll(Size(only ? size.h : 0, size.h)),
        maximumSize: WidgetStatePropertyAll(Size(only ? size.h : double.infinity, size.h)),
        padding: WidgetStatePropertyAll(EdgeInsets.symmetric(horizontal: pad)),
        shape: WidgetStatePropertyAll(

        textStyle: WidgetStatePropertyAll(TextStyle(fontSize: size.font, fontWeight: FontWeight.w500)),
        backgroundColor: WidgetStateProperty.resolveWith((s) => has(s, WidgetState.disabled)
            ? const Color(0xFF181715)
            : has(s, WidgetState.hovered) || has(s, WidgetState.pressed) || size == ButtonSize.px24
                ? const Color(0xFF27272A) : const Color(0xFF181715)),
        foregroundColor: WidgetStateProperty.resolveWith((s) => has(s, WidgetState.disabled)
            ? const Color(0xFF6C6A64)
            : has(s, WidgetState.pressed) ? Colors.white : const Color(0xFFD2CFD9)),
        side: WidgetStateProperty.resolveWith((s) => BorderSide(
            color: has(s, WidgetState.disabled) ? Colors.transparent
                : has(s, WidgetState.hovered) || has(s, WidgetState.pressed) ? const Color(0xFF333137)
                : only ? const Color(0xFF27272A) : Colors.transparent)),

      child: only
          ? iconOnly!
          : Row(mainAxisSize: MainAxisSize.min, children: [
              if (iconLeft != null) ...[iconLeft!, SizedBox(width: size.gap)],
              Text(label ?? ""),

<script type="text/plain" id="dropzone.next">type Props = {
  variant?: "file" | "empty";
  children?: React.ReactNode;       // caption
  icon?: React.ReactNode;
  accept?: string;
  onFiles?: (files: File[]) => void;
  onClick?: () => void;             // empty variant: a button that opens something
};

export function DropZone({ variant = "file", children, icon, accept, onFiles, onClick }: Props) {
  const ref = React.useRef<HTMLInputElement>(null);
  const [over, setOver] = React.useState(false);
  const base = `flex h-[140px] w-[262px] flex-col items-center justify-center gap-4 rounded-xl border bg-[#181715] px-6 text-center
    text-[13px] leading-[18px] text-[#A1A1AA] ${over ? "border-[#9C86FF]" : "border-[#27272A]"}`;
  const tile = <span className="grid size-10 place-items-center rounded-md bg-[#121113] text-[#4A4850]">{icon}</span>;

  if (variant === "empty") {
    return <button type="button" onClick={onClick} className={base}>{tile}{children}</button>;
  }
  return (
    <div role="button" tabIndex={0} className={base}
      onClick={() => ref.current?.click()}
      onKeyDown={(e) => e.key === "Enter" && ref.current?.click()}
      onDragOver={(e) => { e.preventDefault(); setOver(true); }}
      onDragLeave={() => setOver(false)}
      onDrop={(e) => { e.preventDefault(); setOver(false); onFiles?.([...e.dataTransfer.files]); }}>
      {tile}{children}
      <input ref={ref} type="file" multiple accept={accept} hidden onChange={(e) => onFiles?.([...(e.target.files ?? [])])} />
    </div>
  );
}</script>

<script type="text/plain" id="radio.flutter">class PukuRadio<T> extends StatelessWidget {
  const PukuRadio({super.key, required this.value, required this.groupValue, required this.onChanged, this.label});
  final T value, groupValue;
  final ValueChanged<T> onChanged;
  final String? label;

  @override
  Widget build(BuildContext context) {
    final on = value == groupValue;
    return Semantics(
      inMutuallyExclusiveGroup: true, checked: on,
      child: InkWell(
        onTap: () => onChanged(value),
        child: Row(mainAxisSize: MainAxisSize.min, children: [
          Container(
            width: 22, height: 22, alignment: Alignment.center,
            decoration: BoxDecoration(
              shape: BoxShape.circle, color: on ? Colors.white : null,
              border: Border.all(color: on ? const Color(0xFF0075FF) : const Color(0xFFD2CFD9))),
            child: on ? Container(width: 13, height: 13, decoration: const BoxDecoration(color: Color(0xFF0075FF), shape: BoxShape.circle)) : null,
          ),
          if (label != null) ...[const SizedBox(width: 8), Text(label!, style: const TextStyle(color: Colors.white, fontSize: 14))],
        ]),
      ),
    );
  }
}</script>

<script type="text/plain" id="select.next">type Option = { value: string; label: string; icon?: React.ReactNode };
type Props = {
  options: Option[]; value?: string; onChange: (v: string) => void;
  placeholder?: string; size?: "lg" | "sm"; leading?: React.ReactNode; trailing?: React.ReactNode; searchable?: boolean;
};

export function Select({ options, value, onChange, placeholder = "Select your role", size = "lg", leading, trailing, searchable }: Props) {
  const [open, setOpen] = React.useState(false);
  const [q, setQ] = React.useState("");
  const root = React.useRef<HTMLDivElement>(null);
  const current = options.find((o) => o.value === value);
  const shown = options.filter((o) => o.label.toLowerCase().includes(q.toLowerCase()));

  React.useEffect(() => {
    const close = (e: MouseEvent) => !root.current?.contains(e.target as Node) && setOpen(false);
    document.addEventListener("mousedown", close);
    return () => document.removeEventListener("mousedown", close);
  }, []);

  return (
    <div ref={root} className="relative w-[348px] max-w-full" onKeyDown={(e) => e.key === "Escape" && setOpen(false)}>
      <button type="button" role="combobox" aria-expanded={open} aria-haspopup="listbox" onClick={() => setOpen(!open)}

          {searchable && (
            <input autoFocus value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search"
              className="mb-1.5 h-8 w-full rounded-lg bg-[#27272A] px-2 text-sm text-white outline-none placeholder:text-[#6C6A64]" />
          )}
          <ul role="listbox" className="m-0 max-h-72 list-none overflow-auto p-0">
            {shown.map((o) => (
              <li key={o.value} role="option" aria-selected={o.value === value}
                onClick={() => { onChange(o.value); setOpen(false); setQ(""); }}
                className={`flex h-[27px] cursor-pointer items-center justify-between rounded px-3 text-sm text-[#D2CFD9]
                  hover:bg-[#27272A] hover:text-white ${o.value === value ? "bg-[#27272A] text-white" : ""}`}>
                {o.label}{o.value === value && <span aria-hidden>✓</span>}
              </li>
            ))}
          </ul>
        </div>

    </div>
  );

function Row({ node, depth, open, toggle }: { node: Node; depth: number; open: Set<string>; toggle: (n: string) => void }) {
  const isDir = !!node.children;
  const expanded = open.has(node.name);

      <NavItem label={node.name} state={isDir ? "default" : depth ? "indented" : "default"}
        icon={isDir ? <FolderIcon /> : undefined} onClick={() => isDir && toggle(node.name)} />
      {isDir && expanded && node.children!.map((c) => <Row key={c.name} node={c} depth={depth + 1} open={open} toggle={toggle} />)}

  );
}

  return <nav aria-label="Files" className="flex w-60 flex-col">{nodes.map((n) => <Row key={n.name} node={n} depth={0} open={open} toggle={toggle} />)}</nav>;
}</script>

<script type="text/plain" id="filetree.flutter">import 'package:flutter/material.dart';

class FileNode { const FileNode(this.name, [this.children]); final String name; final List<FileNode>? children; }

class FileTree extends StatefulWidget {
  const FileTree({super.key, required this.nodes, this.defaultOpen = const {}});
  final List<FileNode> nodes; final Set<String> defaultOpen;
  @override State<FileTree> createState() => _FileTreeState();
}

class _FileTreeState extends State<FileTree> {
  late final Set<String> open = {...widget.defaultOpen};

  List<Widget> _rows(FileNode n, int depth) {
    final dir = n.children != null;
    return [
      NavItem(label: n.name, icon: dir ? Icons.folder_open : null,
        state: !dir && depth > 0 ? NavState.indented : NavState.normal,
        onTap: dir ? () => setState(() => open.contains(n.name) ? open.remove(n.name) : open.add(n.name)) : null),
      if (dir && open.contains(n.name)) for (final c in n.children!) ..._rows(c, depth + 1),
    ];
  }

  @override
  Widget build(BuildContext context) => SizedBox(width: 240, child: Column(children: [for (final n in widget.nodes) ..._rows(n, 0)]));
}</script>

const open = ref(new Set(props.defaultOpen ?? []));
const toggle = (n: string) => { open.value.has(n) ? open.value.delete(n) : open.value.add(n); open.value = new Set(open.value); };
function flat(nodes: Node[], depth = 0): { name: string; dir: boolean; depth: number }[] {
  return nodes.flatMap((n) => [{ name: n.name, dir: !!n.children, depth }, ...(n.children && open.value.has(n.name) ? flat(n.children, depth + 1) : [])]);
}

<script type="text/plain" id="topnav.rn">import { View, Text, TextInput, Pressable } from "react-native";

const Track = ({ items, value, onChange }: { items: string[]; value: string; onChange: (v: string) => void }) => (
  <View accessibilityRole="tablist" style={{ flexDirection: "row", padding: 4, borderRadius: 8, backgroundColor: "#121113" }}>
    {items.map((i) => (
      <Pressable key={i} accessibilityRole="tab" accessibilityState={{ selected: i === value }} onPress={() => onChange(i)}
        style={{ paddingHorizontal: 12, height: 24, justifyContent: "center", borderRadius: 6, backgroundColor: i === value ? "#27272A" : "transparent" }}>
        <Text style={{ fontSize: 14, color: i === value ? "#fff" : "#D2CFD9" }}>{i}</Text>
      </Pressable>
    ))}
  </View>
);

export function TopNav({ title, tabs, tab, onTab, filters, filter, onFilter, query, onQuery, onBack, onAdd, backPosition = "top" }: any) {
  const back = (
    <Pressable onPress={onBack} style={{ alignSelf: "flex-start", height: 32, paddingHorizontal: 12, borderRadius: 8, backgroundColor: "#27272A", flexDirection: "row", alignItems: "center", gap: 8 }}>
      <Text style={{ color: "#fff", fontSize: 12 }}>← Go Back</Text>
    </Pressable>
  );
  return (
    <View style={{ gap: 12 }}>
      {backPosition !== "bottom" && back}
      <Text style={{ color: "#fff", fontSize: 20, fontWeight: "600" }}>{title}</Text>
      <View style={{ flexDirection: "row", alignItems: "center", gap: 12 }}>
        <Track items={tabs} value={tab} onChange={onTab} />
        <View style={{ width: 1, height: 32, backgroundColor: "#27272A" }} />
        <Track items={filters} value={filter} onChange={onFilter} />
        <TextInput value={query} onChangeText={onQuery} placeholder="Search skills and plugins" placeholderTextColor="#A1A1AA"

        <Pressable onPress={onAdd} style={{ height: 32, paddingHorizontal: 12, borderRadius: 8, backgroundColor: "#fff", justifyContent: "center" }}>
          <Text style={{ color: "#121113", fontWeight: "500" }}>Add +</Text>
        </Pressable>
      </View>
      {backPosition === "bottom" && back}
    </View>
  );
}</script>
<script type="text/plain" id="topnav.flutter">import 'package:flutter/material.dart';

class TopNav extends StatelessWidget {
  const TopNav({super.key, required this.title, required this.tabs, required this.tab, required this.onTab, required this.filters, required this.filter, required this.onFilter, required this.onQuery, this.onBack, this.onAdd, this.backAtBottom = false});
  final String title, tab, filter; final List<String> tabs, filters;
  final ValueChanged<String> onTab, onFilter, onQuery; final VoidCallback? onBack, onAdd; final bool backAtBottom;

  Widget _track(List<String> items, String value, ValueChanged<String> on) => Container(
        padding: const EdgeInsets.all(4),
        decoration: BoxDecoration(color: const Color(0xFF121113), borderRadius: BorderRadius.circular(8)),
        child: Row(children: [
          for (final i in items)
            GestureDetector(onTap: () => on(i), child: Container(
              height: 24, padding: const EdgeInsets.symmetric(horizontal: 12), alignment: Alignment.center,
              decoration: BoxDecoration(color: i == value ? const Color(0xFF27272A) : null, borderRadius: BorderRadius.circular(6)),
              child: Text(i, style: TextStyle(fontSize: 14, color: i == value ? Colors.white : const Color(0xFFD2CFD9))))),
        ]),
      );

  @override
  Widget build(BuildContext context) {
    final back = TextButton.icon(onPressed: onBack, icon: const Icon(Icons.arrow_back, size: 16), label: const Text('Go Back', style: TextStyle(fontSize: 12)),
        style: TextButton.styleFrom(backgroundColor: const Color(0xFF27272A), foregroundColor: Colors.white, minimumSize: const Size(0, 32), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(8))));
    return Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
      if (!backAtBottom) back,
      const SizedBox(height: 12),
      Text(title, style: const TextStyle(fontSize: 20, fontWeight: FontWeight.w600, color: Colors.white)),
      const SizedBox(height: 12),
      Row(children: [
        _track(tabs, tab, onTab), const SizedBox(width: 12),
        Container(width: 1, height: 32, color: const Color(0xFF27272A)), const SizedBox(width: 12),
        _track(filters, filter, onFilter), const SizedBox(width: 12),
        Expanded(child: SizedBox(height: 32, child: TextField(onChanged: onQuery, style: const TextStyle(fontSize: 14, color: Colors.white),
          decoration: InputDecoration(hintText: 'Search skills and plugins', prefixIcon: const Icon(Icons.search, size: 16), filled: true, fillColor: const Color(0xFF121113), contentPadding: EdgeInsets.zero,
            border: OutlineInputBorder(borderRadius: BorderRadius.circular(8), borderSide: BorderSide.none))))),
        const SizedBox(width: 12),
        FilledButton(onPressed: onAdd, style: FilledButton.styleFrom(backgroundColor: Colors.white, foregroundColor: const Color(0xFF121113), minimumSize: const Size(0, 32), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(8))), child: const Text('Add +')),
      ]),
      if (backAtBottom) ...[const SizedBox(height: 12), back],
    ]);
  }
}</script>
